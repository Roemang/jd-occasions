<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aanbod | JD Occasions</title>
  <meta name="description" content="Bekijk het actuele occasion-aanbod van JD Occasions. Filter op merk, prijs, bouwjaar, kilometerstand en brandstof.">
  <meta name="theme-color" content="#0c0c0e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="apple-touch-icon" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="aanbod">
  <div id="header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Home</a> / Aanbod</div>
        <h1>Ons aanbod</h1>
        <p>Alle auto's zijn gecontroleerd, NAP-logisch en worden rijklaar afgeleverd. Gebruik de filters om snel jouw auto te vinden.</p>
      </div>
    </section>

    <div class="container inventory">
      <form class="filters" id="filterForm" autocomplete="off">
        <h3>Filters <button type="button" id="resetFilters">Wissen</button></h3>
        <div class="field">
          <label for="merk">Merk</label>
          <select id="merk" name="merk"></select>
        </div>
        <div class="field">
          <label>Prijs</label>
          <div class="range">
            <select name="prijsMin" aria-label="Minimale prijs">
              <option value="">Min</option><option value="10000">€ 10.000</option><option value="15000">€ 15.000</option>
              <option value="20000">€ 20.000</option><option value="25000">€ 25.000</option><option value="30000">€ 30.000</option>
            </select>
            <select name="prijsMax" aria-label="Maximale prijs">
              <option value="">Max</option><option value="15000">€ 15.000</option><option value="20000">€ 20.000</option>
              <option value="25000">€ 25.000</option><option value="30000">€ 30.000</option><option value="40000">€ 40.000</option><option value="50000">€ 50.000</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="jaarMin">Bouwjaar</label>
          <select id="jaarMin" name="jaarMin"></select>
        </div>
        <div class="field">
          <label for="kmMax">Kilometerstand</label>
          <select id="kmMax" name="kmMax">
            <option value="">Geen maximum</option><option value="25000">Tot 25.000 km</option><option value="50000">Tot 50.000 km</option>
            <option value="75000">Tot 75.000 km</option><option value="100000">Tot 100.000 km</option><option value="150000">Tot 150.000 km</option>
          </select>
        </div>
        <div class="field"><label>Brandstof</label><div class="chips" id="chips-brandstof"></div></div>
        <div class="field"><label>Transmissie</label><div class="chips" id="chips-transmissie"></div></div>
        <div class="field"><label>Type</label><div class="chips" id="chips-carrosserie"></div></div>
        <label style="display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer">
          <input type="checkbox" name="toonVerkocht" style="accent-color:var(--accent);width:16px;height:16px"> Toon ook verkochte auto's
        </label>
        <input type="hidden" name="q" id="qHidden">
      </form>

      <div>
        <div class="toolbar">
          <div class="field search-input" style="flex:1;max-width:380px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="search" id="q" placeholder="Zoek op merk, model of uitvoering…" aria-label="Zoeken">
          </div>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <button class="btn btn-outline filter-toggle" id="filterToggle" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 3H2l8 9.5V19l4 2v-8.5z"/></svg> Filters
            </button>
            <div class="field">
              <select id="sort" aria-label="Sorteren">
                <option value="nieuw">Nieuwste eerst</option>
                <option value="prijsOp">Prijs oplopend</option>
                <option value="prijsAf">Prijs aflopend</option>
                <option value="kmOp">Kilometerstand laag–hoog</option>
                <option value="jaarAf">Bouwjaar nieuw–oud</option>
              </select>
            </div>
          </div>
        </div>
        <p class="count" id="resultCount" style="color:var(--muted);margin-bottom:18px"></p>
        <div class="car-grid" id="results"></div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="/js/main.js"></script>
  <script>
    // Zoekveld koppelen aan het filterformulier
    document.addEventListener("DOMContentLoaded", () => {
      const q = document.getElementById("q"), h = document.getElementById("qHidden");
      const start = new URLSearchParams(location.search).get("q");
      if (start) { q.value = start; h.value = start; }
      q.addEventListener("input", () => { h.value = q.value; document.getElementById("filterForm").dispatchEvent(new Event("input")); });
    });
  </script>
</body>
</html>
