<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | JD Occasions</title>
  <meta name="description" content="Neem contact op met JD Occasions voor een proefrit, inruil of een zoekopdracht.">
  <meta name="theme-color" content="#0c0c0e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="apple-touch-icon" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="contact">
  <div id="header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Home</a> / Contact</div>
        <h1>Contact</h1>
        <p>Vragen over een auto, een proefrit plannen of je auto inruilen? We helpen je graag — bel, app of stuur een bericht.</p>
      </div>
    </section>

    <div class="container contact-grid">
      <div class="contact-info">
        <div class="panel" style="display:grid;gap:20px">
          <div class="info-item">
            <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></div>
            <div><span>Telefoon</span><div id="cTel"></div></div>
          </div>
          <div class="info-item">
            <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 6L2 7"/></svg></div>
            <div><span>E-mail</span><div id="cMail"></div></div>
          </div>
          <div class="info-item">
            <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
            <div><span>Adres</span><div id="cAdres"></div></div>
          </div>
          <a id="cWa" class="btn btn-ghost btn-block" target="_blank" rel="noopener" style="color:#25d366">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4zM12 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4C2.7 15.6 2.2 13.8 2.2 12 2.2 6.6 6.6 2.2 12 2.2c2.6 0 5.1 1 6.9 2.9 1.8 1.8 2.9 4.3 2.9 6.9 0 5.4-4.4 9.8-9.8 9.8zM20.5 3.5C18.2 1.2 15.2 0 12 0 5.4 0 0 5.4 0 12c0 2.1.6 4.2 1.6 6L0 24l6.2-1.6c1.8 1 3.8 1.5 5.8 1.5 6.6 0 12-5.4 12-12 0-3.2-1.2-6.2-3.5-8.4z"/></svg>
            Stuur een WhatsApp
          </a>
        </div>

        <div class="panel">
          <h3 style="margin-bottom:12px">Openingstijden</h3>
          <table class="hours" id="hours"></table>
        </div>

        <div class="map-box"><iframe id="mapFrame" title="Locatie op de kaart" loading="lazy"></iframe></div>
      </div>

      <div class="panel">
        <h2 style="font-size:28px;margin-bottom:6px">Stuur ons een bericht</h2>
        <p class="form-note" style="margin-bottom:26px">We reageren meestal binnen één werkdag.</p>
        <form id="contactForm" class="form-grid">
          <div class="field">
            <label for="naam">Naam *</label>
            <input id="naam" name="naam" required autocomplete="name">
          </div>
          <div class="field">
            <label for="telefoon">Telefoon</label>
            <input id="telefoon" name="telefoon" type="tel" autocomplete="tel">
          </div>
          <div class="field full">
            <label for="email">E-mail *</label>
            <input id="email" name="email" type="email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="onderwerp">Onderwerp</label>
            <select id="onderwerp" name="onderwerp">
              <option>Algemene vraag</option>
              <option>Proefrit</option>
              <option>Inruil</option>
              <option>Zoekopdracht</option>
            </select>
          </div>
          <div class="field">
            <label for="auto">Over auto</label>
            <select id="auto" name="auto"></select>
          </div>
          <div id="inruilFields" style="display:none">
            <div class="field">
              <label for="kenteken">Kenteken inruilauto</label>
              <input id="kenteken" name="kenteken" placeholder="Bijv. AB-123-C" style="text-transform:uppercase">
            </div>
            <div class="field">
              <label for="inruilKm">Kilometerstand inruilauto</label>
              <input id="inruilKm" name="inruilKm" type="number" min="0" placeholder="Bijv. 85000">
            </div>
          </div>
          <!-- Onzichtbaar veld tegen spam-robots -->
          <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
          <div class="field full">
            <label for="bericht">Bericht *</label>
            <textarea id="bericht" name="bericht" required placeholder="Waar kunnen we je mee helpen?"></textarea>
          </div>
          <div class="full">
            <button type="submit" class="btn btn-primary btn-block">Verstuur bericht</button>
          </div>
          <div class="full form-success" id="formSuccess" role="status"></div>
        </form>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="/js/main.js"></script>
</body>
</html>
